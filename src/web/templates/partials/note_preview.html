<div id="note-preview-content" class="h-full">
  {% if rendered_html %}
    <div class="prose prose-invert prose-sm max-w-none
                prose-headings:text-white prose-headings:font-bold prose-headings:tracking-tight
                prose-p:text-slate-300 prose-p:leading-relaxed
                prose-a:text-accent-400 prose-a:no-underline hover:prose-a:underline
                prose-strong:text-white
                prose-code:text-emerald-400 prose-code:bg-surface-800 prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded-md prose-code:font-medium
                prose-pre:bg-[#0f172a] prose-pre:border prose-pre:border-slate-700/50 prose-pre:rounded-xl prose-pre:shadow-inner
                prose-ul:text-slate-300 prose-ol:text-slate-300
                prose-blockquote:border-accent-500/50 prose-blockquote:text-slate-400 prose-blockquote:bg-surface-800/50 prose-blockquote:py-1 prose-blockquote:pr-4 prose-blockquote:rounded-r-lg">
      {{ rendered_html | safe }}
    </div>
  {% else %}
    <div class="flex h-full items-center justify-center text-slate-600 text-sm italic">
      Preview will appear here upon saving.
    </div>
  {% endif %}
</div>
