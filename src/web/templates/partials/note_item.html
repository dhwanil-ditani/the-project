<!-- Partial: Note card in sidebar list -->
<a href="#"
   id="note-item-{{ note.id }}"
   hx-get="/web/notes/{{ note.id }}"
   hx-target="#editor-panel"
   hx-swap="innerHTML"
   onclick="document.querySelectorAll('.note-nav-item').forEach(el => el.classList.remove('bg-surface-700/60', 'border-l-accent-500')); this.classList.add('bg-surface-700/60', 'border-l-accent-500');"
   class="note-nav-item flex items-start gap-3 px-3 py-2.5 border-l-[3px] border-transparent hover:bg-surface-700/40 transition-all duration-150 cursor-pointer group">
  
  <div class="mt-0.5 text-slate-500 group-hover:text-accent-400 transition-colors">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
    </svg>
  </div>
  
  <div class="flex-1 min-w-0">
    <p class="text-xs font-medium text-slate-200 truncate group-hover:text-white transition-colors leading-tight">
      {{ note.title }}
    </p>
    <p class="text-[10px] text-slate-500 mt-1 truncate">
      {{ note.updated_at.strftime('%b %d, %H:%M') if note.updated_at else 'Just now' }}
    </p>
  </div>
</a>
