<!-- Partial: Edit bookmark card form -->
<div id="bookmark-card-{{ bookmark.id }}"
     class="bg-surface-800 border border-accent-500/50 rounded-xl overflow-hidden shadow-lg shadow-accent-500/10">

  <form hx-post="/web/bookmarks/hx/{{ bookmark.id }}/edit"
        hx-target="#bookmark-card-{{ bookmark.id }}"
        hx-swap="outerHTML"
        class="flex flex-col h-full">

    <div class="p-4 flex-1 space-y-3">
      <div>
        <label class="block text-[10px] font-medium text-slate-400 uppercase tracking-wider mb-1">Title</label>
        <input type="text" name="title" value="{{ bookmark.title or '' }}" required
               class="w-full px-2.5 py-1.5 bg-surface-900 border border-slate-700/50 rounded-lg text-sm text-white focus:outline-none focus:border-accent-500/50 focus:ring-1 focus:ring-accent-500/30" />
      </div>

      <div>
        <label class="block text-[10px] font-medium text-slate-400 uppercase tracking-wider mb-1">Description</label>
        <textarea name="description" rows="3"
                  class="w-full px-2.5 py-1.5 bg-surface-900 border border-slate-700/50 rounded-lg text-xs text-white focus:outline-none focus:border-accent-500/50 focus:ring-1 focus:ring-accent-500/30">{{ bookmark.description or '' }}</textarea>
      </div>
      
      <div class="text-[10px] text-slate-500 font-mono truncate pt-1">
        {{ bookmark.url }}
      </div>
    </div>

    <!-- Actions Footer -->
    <div class="px-4 py-3 border-t border-slate-700/30 bg-surface-900/50 flex items-center justify-end gap-2">
      <button type="button"
              hx-get="/web/bookmarks/hx/{{ bookmark.id }}"
              hx-target="#bookmark-card-{{ bookmark.id }}"
              hx-swap="outerHTML"
              class="px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-700/50 transition-colors">
        Cancel
      </button>
      <button type="submit"
              class="px-3 py-1.5 rounded-lg text-xs font-medium bg-accent-600 hover:bg-accent-500 text-white shadow-md shadow-accent-600/20 transition-all">
        Save Changes
      </button>
    </div>

  </form>
</div>
