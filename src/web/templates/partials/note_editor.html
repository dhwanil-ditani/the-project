<!-- Partial: Note editor form + rendered preview (loaded via HTMX into #editor-panel) -->
<form
  hx-post="/web/notes/hx/save"
  hx-target="#save-feedback"
  hx-swap="innerHTML"
  hx-indicator="#save-spinner"
  class="h-full w-full grid grid-rows-[auto_auto_1fr] bg-surface-800"
>
  <input type="hidden" name="note_id" value="{{ note.id }}" />

  <!-- Row 1: Top header section -->
  <div class="px-6 py-5 flex items-start justify-between gap-4">
    <!-- Title input (borderless, auto-resizing style) -->
    <input type="text" name="title" value="{{ note.title }}" placeholder="Untitled Note" required
           class="flex-1 bg-transparent text-2xl font-bold text-white placeholder-slate-600 focus:outline-none transition-all" />
    
    <!-- Action Save Button -->
    <div class="flex items-center gap-3 shrink-0 mt-1">
      <div id="save-feedback" class="text-xs text-emerald-400 font-medium"></div>
      <div id="save-spinner" class="htmx-indicator">
        <svg class="w-4 h-4 text-accent-400 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
      </div>
      <button type="submit"
              class="px-4 py-1.5 bg-accent-600 hover:bg-accent-500 text-white text-xs font-semibold rounded-md transition-all flex items-center gap-2 shadow-lg shadow-accent-600/20">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        Save
      </button>
    </div>
  </div>

  <!-- Row 2: Utility Row -->
  <div class="px-6 py-2 border-y border-slate-700/50 bg-surface-900/30 flex items-center justify-between">
    <div class="flex items-center gap-1">
      <button type="button" class="p-1.5 rounded text-slate-400 hover:text-white hover:bg-surface-700 transition-colors" title="Format Bold">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 12h8a4 4 0 100-8H6v8zm0 0h9a4 4 0 110 8H6v-8z"/></svg>
      </button>
      <button type="button" class="p-1.5 rounded text-slate-400 hover:text-white hover:bg-surface-700 transition-colors" title="Format Italic">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
      </button>
      <div class="w-px h-4 bg-slate-700/50 mx-1"></div>
      <!-- HTMX Image Upload Form -->
      <div class="flex items-center gap-2">
        <div class="flex items-center m-0"
              hx-post="/web/notes/hx/upload" 
              hx-encoding="multipart/form-data" 
              hx-target="#upload-helper-zone" 
              hx-swap="innerHTML">
          <label class="p-1.5 rounded text-slate-400 hover:text-accent-400 hover:bg-accent-500/10 transition-colors flex items-center gap-1.5 text-xs font-medium cursor-pointer" title="Upload Image">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span class="hidden sm:inline">Add Media</span>
            <input type="file" name="file" accept="image/*" class="hidden" onchange="this.parentElement.parentElement.dispatchEvent(new Event('submit', { cancelable: true }))" />
          </label>
        </div>
        <div id="upload-helper-zone" class="text-xs text-slate-400 flex items-center"></div>
      </div>
    </div>
    <div class="text-[10px] text-slate-500 font-mono flex items-center gap-3">
      <span>ID: {{ note.id }}</span>
      <span>Use [[wiki-links]]</span>
    </div>
  </div>

  <!-- Row 3: Main Workspace (Editor + Preview Split) -->
  <div class="grid grid-cols-1 lg:grid-cols-2 h-full min-h-0 overflow-hidden">
    
    <!-- Editor -->
    <div class="h-full border-b lg:border-b-0 lg:border-r border-slate-700/50 bg-[#0f172a] relative overflow-hidden"
         x-data="{ 
            init() {
              this.$nextTick(() => {
                if (typeof CodeMirror !== 'undefined') {
                  const cm = CodeMirror.fromTextArea(this.$refs.textarea, {
                    lineNumbers: true,
                    mode: 'markdown',
                    theme: 'nord',
                    lineWrapping: true
                  });
                  cm.on('change', () => { 
                    this.$refs.textarea.value = cm.getValue(); 
                  });
                }
              });
            }
         }">
      
      <textarea name="content" x-ref="textarea" class="hidden">{{ note.content }}</textarea>

      <!-- Custom overrides for CodeMirror to seamlessly match our premium dark theme -->
      <style>
        .CodeMirror {
          height: 100%;
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
          font-size: 0.875rem;
          line-height: 1.625;
          background: transparent !important;
          color: #cbd5e1;
          padding: 1.5rem 0;
        }
        .CodeMirror-gutters {
          background: rgba(15, 23, 42, 0.4) !important;
          border-right: 1px solid rgba(51, 65, 85, 0.5) !important;
        }
        .CodeMirror-linenumber {
          color: #475569 !important;
          padding-right: 12px !important;
        }
        .CodeMirror-cursor { border-left: 2px solid #a78bfa !important; }
        .CodeMirror-selected { background: rgba(139, 92, 246, 0.25) !important; }
        .CodeMirror-line::selection, .CodeMirror-line > span::selection, .CodeMirror-line > span > span::selection { background: rgba(139, 92, 246, 0.25); }
      </style>
    </div>

    <!-- Preview -->
    <div class="h-full w-full p-6 overflow-y-auto custom-scrollbar bg-surface-900">
      {% include "partials/note_preview.html" %}
    </div>
    
  </div>
</form>
