<!-- Partial: Note editor form + rendered preview (loaded via HTMX into #editor-panel) -->
<div class="flex flex-col h-full bg-surface-800">
  
  <form
    hx-post="/web/notes/hx/save"
    hx-target="#save-feedback"
    hx-swap="innerHTML"
    hx-indicator="#save-spinner"
    class="flex flex-col h-full"
  >
    <input type="hidden" name="note_id" value="{{ note.id }}" />

    <!-- Top header section -->
    <div class="px-6 py-5 shrink-0 flex items-start justify-between gap-4">
      <!-- Title input (borderless, auto-resizing style) -->
      <input type="text" name="title" value="{{ note.title }}" placeholder="Untitled Note" required
             class="flex-1 bg-transparent text-2xl font-bold text-white placeholder-slate-600 focus:outline-none transition-all" />
      
      <!-- Action Save Button -->
      <div class="flex items-center gap-3 shrink-0 mt-1">
        <div id="save-feedback" class="text-xs text-emerald-400 font-medium"></div>
        <div id="save-spinner" class="htmx-indicator">
          <svg class="w-4 h-4 text-accent-400 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </div>
        <button type="submit"
                class="px-4 py-1.5 bg-accent-600 hover:bg-accent-500 text-white text-xs font-semibold rounded-md transition-all flex items-center gap-2 shadow-lg shadow-accent-600/20">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          Save
        </button>
      </div>
    </div>

    <!-- Utility Row -->
    <div class="px-6 py-2 border-y border-slate-700/50 bg-surface-900/30 shrink-0 flex items-center justify-between">
      <div class="flex items-center gap-1">
        <button type="button" class="p-1.5 rounded text-slate-400 hover:text-white hover:bg-surface-700 transition-colors" title="Format Bold">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 12h8a4 4 0 100-8H6v8zm0 0h9a4 4 0 110 8H6v-8z"/></svg>
        </button>
        <button type="button" class="p-1.5 rounded text-slate-400 hover:text-white hover:bg-surface-700 transition-colors" title="Format Italic">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
        </button>
        <div class="w-px h-4 bg-slate-700/50 mx-1"></div>
        <button type="button" class="p-1.5 rounded text-slate-400 hover:text-accent-400 hover:bg-accent-500/10 transition-colors flex items-center gap-1.5 text-xs font-medium" title="Upload Image">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <span class="hidden sm:inline">Add Media</span>
        </button>
      </div>
      <div class="text-[10px] text-slate-500 font-mono flex items-center gap-3">
        <span>ID: {{ note.id }}</span>
        <span>Use [[wiki-links]]</span>
      </div>
    </div>

    <!-- Main Workspace (Editor + Preview Split) -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
      
      <!-- Editor -->
      <div class="flex-1 p-0 flex flex-col border-b lg:border-b-0 lg:border-r border-slate-700/50 relative bg-[#0f172a]">
        <textarea name="content" 
                  placeholder="Start writing..."
                  class="w-full h-full p-6 bg-transparent border-none text-sm text-slate-300 placeholder-slate-600 focus:outline-none focus:ring-0 resize-none font-mono leading-relaxed custom-scrollbar">{{ note.content }}</textarea>
      </div>

      <!-- Preview -->
      <div class="flex-1 p-6 overflow-y-auto custom-scrollbar bg-surface-900">
        {% if rendered_html %}
          <div class="prose prose-invert prose-sm max-w-none
                      prose-headings:text-white prose-headings:font-bold prose-headings:tracking-tight
                      prose-p:text-slate-300 prose-p:leading-relaxed
                      prose-a:text-accent-400 prose-a:no-underline hover:prose-a:underline
                      prose-strong:text-white
                      prose-code:text-emerald-400 prose-code:bg-surface-800 prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded-md prose-code:font-medium
                      prose-pre:bg-[#0f172a] prose-pre:border prose-pre:border-slate-700/50 prose-pre:rounded-xl prose-pre:shadow-inner
                      prose-ul:text-slate-300 prose-ol:text-slate-300
                      prose-blockquote:border-accent-500/50 prose-blockquote:text-slate-400 prose-blockquote:bg-surface-800/50 prose-blockquote:py-1 prose-blockquote:pr-4 prose-blockquote:rounded-r-lg">
            {{ rendered_html | safe }}
          </div>
        {% else %}
          <div class="flex h-full items-center justify-center text-slate-600 text-sm italic">
            Preview will appear here upon saving.
          </div>
        {% endif %}
      </div>
      
    </div>
  </form>
</div>
