<tr class="border-b border-slate-700/30 bg-surface-800/80" id="task-row-{{ task.id }}">
  <td colspan="5" class="px-4 py-3">
    <form hx-post="/web/tasks/hx/{{ task.id }}/edit"
          hx-target="#task-row-{{ task.id }}"
          hx-swap="outerHTML"
          class="flex items-center gap-3">
      
      <div class="flex-1">
        <input type="text" name="title" value="{{ task.title }}" required
               class="w-full px-2 py-1.5 bg-surface-900 border border-accent-500/50 rounded-md text-sm text-white focus:outline-none focus:ring-1 focus:ring-accent-500/50" />
      </div>
      
      <div class="w-32">
        <select name="priority"
                class="w-full px-2 py-1.5 bg-surface-900 border border-slate-700/50 rounded-md text-sm text-white focus:outline-none focus:border-accent-500/50">
          <option value="Low" {% if task.priority.value == 'Low' %}selected{% endif %}>Low</option>
          <option value="Medium" {% if task.priority.value == 'Medium' %}selected{% endif %}>Medium</option>
          <option value="High" {% if task.priority.value == 'High' %}selected{% endif %}>High</option>
        </select>
      </div>
      
      <div class="w-40">
        <select name="note_id"
                class="w-full px-2 py-1.5 bg-surface-900 border border-slate-700/50 rounded-md text-sm text-white focus:outline-none focus:border-accent-500/50">
          <option value="">No Note</option>
          {% for note in notes %}
            <option value="{{ note.id }}" {% if task.note_id == note.id %}selected{% endif %}>{{ note.title }}</option>
          {% endfor %}
        </select>
      </div>
      
      <div class="w-36">
        <input type="date" name="due_date" value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date else '' }}"
               class="w-full px-2 py-1.5 bg-surface-900 border border-slate-700/50 rounded-md text-sm text-white focus:outline-none focus:border-accent-500/50" />
      </div>
      
      <div class="flex items-center gap-2 pl-2">
        <button type="submit"
                class="px-3 py-1.5 bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/30 rounded-md text-xs font-medium transition-colors">
          Save
        </button>
        <button type="button"
                hx-get="/web/tasks/hx/{{ task.id }}"
                hx-target="#task-row-{{ task.id }}"
                hx-swap="outerHTML"
                class="px-3 py-1.5 bg-slate-700/50 text-slate-300 hover:bg-slate-700 rounded-md text-xs font-medium transition-colors">
          Cancel
        </button>
      </div>
    </form>
  </td>
</tr>
