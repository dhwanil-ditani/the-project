version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-os_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-personal_os}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-os_admin} -d ${POSTGRES_DB:-personal_os}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://os_admin:your_secure_password@db:5432/personal_os}
    volumes:
      # Map local ./uploads to container's static uploads directory for PKB image persistence
      - ./uploads:/app/src/static/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
