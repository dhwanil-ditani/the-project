<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117;
            color: #e1e4e8;
            min-height: 100vh;
            padding: 2rem;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 2rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1.5rem;
            transition: border-color 0.2s, transform 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card:hover {
            border-color: #58a6ff;
            transform: translateY(-2px);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }
        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #21262d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }
        .card-name { font-size: 1.1rem; font-weight: 600; }
        .card-desc { color: #8b949e; font-size: 0.875rem; line-height: 1.5; margin-bottom: 1rem; }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.8rem;
            padding: 0.25rem 0.625rem;
            border-radius: 12px;
        }
        .status.online {
            background: rgba(63, 185, 80, 0.15);
            color: #3fb950;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Services</h1>
        <div class="grid">
            {% for service in services %}
            <a href="{{ service.url }}" class="card" target="_blank">
                <div class="card-header">
                    <div class="card-icon">{{ service.icon }}</div>
                    <span class="card-name">{{ service.name }}</span>
                </div>
                <p class="card-desc">{{ service.description }}</p>
                <span class="status {{ service.status | default('online') }}">
                    <span class="status-dot"></span>
                    {{ service.status | default('online') | capitalize }}
                </span>
            </a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
